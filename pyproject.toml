[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-client-core"
version = "2026.05.08.01"
description = "Shared base library for Ophix Tier 1 clients"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "distro>=1.9.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
